name: PR Validation

on: pull_request

jobs:
  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5

  dry_run_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        id: install_deps
        run: npm install

      - name: Build
        if: steps.install_deps.outcome == 'success'
        run: npm run build
