<body class="games-component">
    <div class="games-screen-border">
        <div class="games-screen">
            <div class="games-screen-component games-menu-component">
                <div class="games-menu-grid">
                    @for (game of games; track game.displayName) {
                    <a class="games-menu-item" routerLink="{{game.path}}" [class.games-menu-item-disabled]="isGameDetailView">
                        <img src="{{game.iconPath ?? gameIconPathDefault}}" alt="{{game.displayName}} Logo" class="games-menu-item-logo" />
                        <p class="games-menu-item-text">{{game.displayName}}</p>
                    </a>
                    }
                </div>
            </div>
            <div class="games-screen-component" [class.game-detail-focus]="isGameDetailView" [class.game-detail-unfocus]="!isGameDetailView">
                <router-outlet />
            </div>
        </div>
    </div>
</body>
